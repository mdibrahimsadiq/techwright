<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Techwright – brand assets (Google Form header, Instagram profile picture)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#0b1120;--bg2:#0f172a;--card:#131c31;--ink:#e8edf5;--muted:#94a3b8;--line:#22304a;--accent:#4f7cff;--accent-hi:#6b91ff;--cloud:#e8a33d;--live:#34d399;--navy:#0b1120}
*{box-sizing:border-box;margin:0}
body{background:#05080f;padding:40px;display:flex;flex-direction:column;gap:40px;align-items:flex-start;font-family:"Space Grotesk",sans-serif;color:var(--ink)}
.grad{background:linear-gradient(90deg,var(--accent-hi),#9db6ff 45%,var(--cloud));-webkit-background-clip:text;background-clip:text;color:transparent}
.gridbg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:48px 48px}

/* Google Form header: 1600x400 (4:1) */
.header{position:relative;width:1600px;height:400px;overflow:hidden;background:var(--bg);display:flex;align-items:center;padding:0 96px}
.header::before{content:"";position:absolute;right:-160px;top:-300px;width:900px;height:900px;background:radial-gradient(circle,rgba(79,124,255,.42),transparent 62%)}
.header::after{content:"";position:absolute;left:-240px;bottom:-420px;width:800px;height:800px;background:radial-gradient(circle,rgba(232,163,61,.16),transparent 62%)}
.header .gridbg{mask-image:linear-gradient(90deg,transparent,#000 60%)}
.header>*:not(.gridbg){position:relative;z-index:1}
.hl{flex:1}
.logo{font:800 40px "Bricolage Grotesque",sans-serif;letter-spacing:-.04em}
.logo i{font-style:normal;color:var(--accent-hi)}
.header h1{font:800 104px/0.98 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em;margin-top:18px}
.header p{font-size:28px;color:var(--muted);margin-top:16px}
.header p b{color:var(--ink);font-weight:700}
.stk{position:relative;width:360px;height:300px;flex:none}
.st{position:absolute;font:700 28px "Space Grotesk",sans-serif;padding:14px 24px;border-radius:18px;color:var(--navy);border:3px solid var(--navy);box-shadow:6px 6px 0 #000;white-space:nowrap}
.st:nth-child(1){top:6px;right:20px;background:var(--cloud);transform:rotate(7deg)}
.st:nth-child(2){top:112px;left:0;background:var(--accent);color:#fff;transform:rotate(-6deg)}
.st:nth-child(3){top:212px;right:0;background:#fff;transform:rotate(5deg)}

/* Instagram profile picture: 1080x1080, shown as a circle */
.dp{position:relative;width:1080px;height:1080px;overflow:hidden;background:var(--bg);display:grid;place-items:center}
.dp::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 25%,rgba(79,124,255,.55),transparent 55%),radial-gradient(circle at 25% 85%,rgba(232,163,61,.22),transparent 55%)}
.dp .gridbg{background-size:72px 72px;mask-image:radial-gradient(circle,#000 30%,transparent 72%)}
.tile{position:relative;z-index:1;width:560px;height:560px;border-radius:150px;background:var(--accent);border:10px solid var(--navy);box-shadow:30px 30px 0 var(--cloud);transform:rotate(-7deg);display:grid;place-items:center}
.tile span{font:800 330px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.07em;color:#fff;transform:translate(-8px,-14px)}
.tile i{position:absolute;right:92px;bottom:118px;width:62px;height:62px;border-radius:50%;background:var(--cloud);border:8px solid var(--navy)}

/* alternative: wordmark profile picture */
.dp2 .word{position:relative;z-index:1;text-align:center}
.dp2 .word b{display:block;font:800 210px/0.9 "Bricolage Grotesque",sans-serif;letter-spacing:-.06em}
.dp2 .word b+b{color:var(--accent-hi)}
.dp2 .word small{display:inline-block;margin-top:34px;font:700 34px "Space Grotesk",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--navy);background:var(--cloud);padding:10px 26px;border-radius:999px;border:5px solid var(--navy);box-shadow:8px 8px 0 #000}

/* circle preview helper (not exported) */
.ring{width:320px;height:320px;border-radius:50%;overflow:hidden;border:2px solid #333}
.ring>div{transform:scale(.2963);transform-origin:0 0}
</style>
</head>
<body>
<div class="header" id="form-header">
<div class="gridbg"></div>
<div class="hl"><div class="logo">tech<i>wright</i></div>
<h1>15-Day Online <span class="grad">Internship</span></h1>
<p><b>Cloud &amp; DevOps</b> · Live online · Certificate</p></div>
<div class="stk"><span class="st">☁️ AWS</span><span class="st">📦 Docker</span><span class="st">✨ Claude AI</span></div>
</div>

<div class="dp" id="dp"><div class="gridbg"></div><div class="tile"><span>tw</span><i></i></div></div>

<div class="dp dp2" id="dp-wordmark"><div class="gridbg"></div><div class="word"><b>tech</b><b>wright</b><small>Internships</small></div></div>
</body>
</html>
